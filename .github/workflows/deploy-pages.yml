name: Deploy to GitHub Pages

# Только ручной запуск кнопкой "Run workflow" в UI GitHub (вкладка Actions).
# Никаких автодеплоев по push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не запускаем несколько деплоев одновременно.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # npm ci ставит ровно версию из lock и не подтянет более свежую,
        # поэтому ставим всё через npm install и принудительно тянем
        # последнюю версию @sevtech/icons на каждом запуске
        run: |
          npm install
          npm install @sevtech/icons@latest --no-save

      - name: Build
        # base-href берётся из имени репозитория → /icons-list/
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/icons-list/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4